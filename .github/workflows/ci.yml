name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify public API types
        run: npm run test:public-types

      - name: Build Storybook
        run: npm run build-storybook

      - name: Typecheck docs
        run: npm run docs:typecheck

      - name: Build docs
        run: npm run docs-dist

      - name: Build examples
        run: npm run examples:check

      - name: Verify generated artifacts
        run: npm run ci:artifacts

      - name: Smoke-check npm pack
        run: npm pack --dry-run
