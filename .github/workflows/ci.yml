name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run linters
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Verify public API types
        run: npm run test:public-types

      - name: Build Storybook
        run: npm run build-storybook

      - name: Typecheck sources
        run: npm run typecheck

      - name: Verify site metadata and interactions
        run: npm run site:verify

      - name: Verify generated artifacts
        run: npm run ci:artifacts

      - name: Smoke-check npm pack
        run: npm pack --dry-run
